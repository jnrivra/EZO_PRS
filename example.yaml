# Example ESPHome configuration for EZO PRS pressure sensor

# Basic ESP32 setup
esphome:
  name: pressure_sensor
  platform: ESP32
  board: esp32dev

# Enable WiFi
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key

# Enable OTA updates
ota:
  password: !secret ota_password

# Enable Web Server
web_server:
  port: 80

# Enable logging
logger:
  level: INFO

# Enable I2C
i2c:
  sda: GPIO21
  scl: GPIO22
  scan: true
  id: bus_a

# External component configuration
external_components:
  - source: github://jnrivra/EZO_PRS@main
    components: [ ezo_prs ]

# EZO PRS sensor configuration
sensor:
  - platform: ezo_prs
    name: "Water Pressure"
    id: pressure_sensor
    address: 0x6A  # Default address
    update_interval: 5s
    pressure_unit: cmh2o  # Options: psi, atm, bar, kpa, inh2o, cmh2o
    decimals: 3  # Number of decimal places (0-3)
    info_text_sensor: pressure_info
    status_text_sensor: pressure_status

# Text sensors for additional information
text_sensor:
  - platform: template
    name: "Pressure Sensor Info"
    id: pressure_info
    
  - platform: template
    name: "Pressure Sensor Status"
    id: pressure_status

# Buttons for sensor control
button:
  - platform: template
    name: "Calibrate Zero"
    on_press:
      then:
        - lambda: |-
            id(pressure_sensor).calibrate_zero();
            
  - platform: template
    name: "Clear Calibration"
    on_press:
      then:
        - lambda: |-
            id(pressure_sensor).clear_calibration();
            
  - platform: template
    name: "Check Calibration"
    on_press:
      then:
        - lambda: |-
            id(pressure_sensor).check_calibration();
            
  - platform: template
    name: "Get Status"
    on_press:
      then:
        - lambda: |-
            id(pressure_sensor).get_status();
            
  - platform: template
    name: "Clear Offset"
    on_press:
      then:
        - lambda: |-
            id(pressure_sensor).clear_offset(); 