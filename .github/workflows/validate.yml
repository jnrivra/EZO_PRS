name: Validate ESPHome Component

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install ESPHome
        run: pip install esphome

      - name: Create placeholder secrets for validation
        run: |
          cat > secrets.yaml <<'EOF'
          wifi_ssid: "ci-ssid"
          wifi_password: "ci-password"
          api_encryption_key: "bo3DSjQDR9JsiLfFLmcd0wjC0OBYY/M5pXBIvyxjp50="
          ota_password: "ci-ota-password"
          EOF

      - name: Validate example configuration
        run: esphome config example.yaml
        
      - name: Validate component structure
        run: |
          test -d components/ezo_prs || (echo "Missing components/ezo_prs directory" && exit 1)
          test -f components/ezo_prs/__init__.py || (echo "Missing __init__.py" && exit 1)
          test -f components/ezo_prs/sensor.py || (echo "Missing sensor.py" && exit 1)
          test -f components/ezo_prs/ezo_prs.h || (echo "Missing ezo_prs.h" && exit 1)
          test -f components/ezo_prs/ezo_prs.cpp || (echo "Missing ezo_prs.cpp" && exit 1) 